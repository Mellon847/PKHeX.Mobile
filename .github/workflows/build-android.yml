name: Build PKHeX.Mobile Android

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore dependencies
        run: nuget restore PKHeX.Mobile.sln

      - name: Build Android application
        shell: pwsh
        run: |
          $project = Get-ChildItem -Recurse -Filter "PKHeX.Android.csproj" |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $project) {
            throw "PKHeX.Android.csproj was not found."
          }

          $msbuild = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $msbuild)) {
            throw "Visual Studio Build Tools locator was not found."
          }

          $vsPath = & $msbuild -latest -products "*" -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio installation was not found."
          }

          $msbuildExe = Join-Path $vsPath "MSBuild\Current\Bin\MSBuild.exe"

          & $msbuildExe $project /t:PackageForAndroid /p:Configuration=Release /restore

          if ($LASTEXITCODE -ne 0) {
            throw "Android build failed with exit code $LASTEXITCODE"
          }

      - name: Find generated APK
        id: apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Recurse -Filter "*.apk" |
            Where-Object { $_.FullName -match '\\bin\\Release\\' } |
            Select-Object -First 1

          if (-not $apk) {
            throw "No APK was generated."
          }

          "path=$($apk.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PKHeX-Mobile-Android
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7
